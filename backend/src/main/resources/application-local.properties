# ------------------------------------------------------------
# Perfil "local": banco H2 em memoria, sem internet e sem instalar nada.
# Ativado pelo rodar.cmd (SPRING_PROFILES_ACTIVE=local).
# Os dados sao recriados a cada inicializacao; alteracoes feitas
# no console H2 se perdem ao fechar a API.
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:phishing_shield;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.schema-locations=classpath:h2/schema-h2.sql
spring.sql.init.data-locations=classpath:h2/data-h2.sql

# Console web do banco: http://localhost:9090/h2-console
# JDBC URL: jdbc:h2:mem:phishing_shield  | usuario: sa | senha: (vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
