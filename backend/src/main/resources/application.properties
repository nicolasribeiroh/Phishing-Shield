# Porta: o Render define a variavel PORT; localmente usa 9090
server.port=${PORT:9090}
spring.application.name=phishing-shield

# ------------------------------------------------------------
# PostgreSQL (Neon) - dicionario de phishing
# Valores vem de variaveis de ambiente:
#   no Render  -> Environment Variables do servico
#   localmente -> arquivo backend/credenciais.cmd (fora do Git)
# Nao grave senhas reais neste arquivo.
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/phishing_shield}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Poucas conexoes e nenhuma conexao ociosa: permite que o Neon
# "durma" quando nao ha uso e economiza a cota gratuita.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# Tabelas criadas por schema.sql e data.sql (idempotentes)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
